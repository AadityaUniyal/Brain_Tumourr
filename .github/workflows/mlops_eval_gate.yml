name: MLOps Performance Regression Gate

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  performance-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Automated Clinical Performance Regression Gate
      id: eval_gate
      run: |
        python scripts/ci_regression_gate.py

    - name: Publish Gate Summary to GitHub Step Summary
      if: always()
      run: |
        if [ -f reports/ci_evaluation_summary.md ]; then
          cat reports/ci_evaluation_summary.md >> $GITHUB_STEP_SUMMARY
        fi

    - name: Post PR Summary Comment
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const reportPath = 'reports/ci_evaluation_summary.md';
          if (fs.existsSync(reportPath)) {
            const report = fs.readFileSync(reportPath, 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
          }
